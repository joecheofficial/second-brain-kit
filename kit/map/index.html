<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My second brain</title>
<style>
  html, body { margin: 0; height: 100%; background: #070b14; color: #e7ecf5; font: 15px/1.5 system-ui, sans-serif; }
  #root { width: 100vw; height: 100vh; }
  #status { position: fixed; inset: auto 0 24px 0; margin: auto; width: max-content; max-width: 90vw; padding: 8px 14px; border-radius: 8px; background: #121a2b; }
  #back { position: fixed; top: 12px; right: 12px; z-index: 10; }
  .picker { max-width: 640px; margin: 10vh auto; padding: 0 20px; display: flex; flex-direction: column; gap: 10px; }
  .picker h1 { font-size: 24px; margin: 0; }
  .picker p { color: #b8c2d6; margin: 0 0 8px; }
  .picker button, #back { font: inherit; text-align: left; padding: 12px 16px; border-radius: 10px; border: 1px solid #2a3654; background: #101829; color: inherit; cursor: pointer; }
  .picker button:hover, .picker button:focus-visible, #back:hover { border-color: #8fb4ff; outline: none; }
  #depth { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 10; font: 600 14px/1 system-ui, sans-serif; letter-spacing: .08em; padding: 11px 22px; border-radius: 999px; border: 1px solid #8fb4ff; background: #101829e6; color: #e7ecf5; cursor: pointer; box-shadow: 0 0 24px #7aa7ff55; }
  #depth:hover, #depth:focus-visible { background: #18233a; outline: 2px solid #8fb4ff; outline-offset: 2px; }
  .depth { position: fixed; inset: 0; z-index: 20; background: #0b0e14; }
  .depth-canvas { width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  .depth-labels { position: absolute; inset: 0; pointer-events: none; }
  .depth-labels span { position: absolute; white-space: nowrap; color: #e6eaf2; font-weight: 600; text-shadow: 0 0 3px #0b0e14, 0 0 8px #0b0e14; }
  .depth-bar { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .depth-modes { display: flex; gap: 0; margin: 0 auto; border: 1px solid #2a3654; border-radius: 999px; overflow: hidden; }
  .depth-bar button { font: inherit; padding: 8px 14px; border-radius: 999px; border: 1px solid #2a3654; background: #101829e6; color: inherit; cursor: pointer; }
  .depth-modes button { border: 0; border-radius: 0; }
  .depth-modes button[aria-checked="true"], .depth-bar button[aria-pressed="true"] { background: #24365e; color: #fff; }
  .depth-bar button:focus-visible { outline: 2px solid #8fb4ff; outline-offset: 2px; }
  .depth-card { position: absolute; left: 14px; bottom: 14px; max-width: 360px; padding: 12px 14px; border-radius: 12px; background: #101829ee; border: 1px solid #2a3654; }
  .depth-card .meta { color: #b8c2d6; font-size: 13px; margin-top: 2px; }
  .depth-card p { margin: 8px 0 0; font-size: 14px; }
  .depth-card code { display: block; margin-top: 8px; font-size: 12px; color: #b8c2d6; word-break: break-all; }
  .depth-hint { position: absolute; right: 14px; bottom: 14px; max-width: 420px; text-align: right; color: #b8c2d6; font-size: 13px; }
  @media (max-width: 720px) { .depth-hint { display: none } }
</style>
<button id="back" type="button" hidden>All areas</button>
<button id="depth" type="button" hidden data-graph-reserve title="See your notes in 3D">3D</button>
<div id="root"></div>
<div id="status" role="status">Loading your map…</div>
<!-- brain-data.js is written by `node kit/brain.mjs map` and stays on this computer. -->
<script src="brain-data.js"></script>
<script src="viewer.js"></script>
</html>
